<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Arreglos con JS</title>
</head>
<body>
    <header class="container-fluid p-5 bg-success text-white text-center">
        <h1>3 Ejercicios Manejo de Arreglos</h1>
        <p>LLenado, impresión, funciones de arreglos</p> 
    </header>
    <section class="container mt-5 bg-light p-4 rounded text-dark">
        <form action="" method="post" id="formSueldo" name="formSueldo">
            <div class="m-3 col-sm-4">
                <h2>Ejercicio Calcular Sueldo</h2>
                <label for="puesto" class="form-label">Puesto: </label>
                <select id="puesto" size="1" name="puesto">
                    <option value=0>Diseñador</option>
                    <option value=1>Programador</option>
                    <option value=2>Lider</option>
                </select>
                <br>
                <label for="nivel" class="form-label">Nivel: </label>
                <select id="nivel" size="1" name="nivel">
                    <option value=0>Newbie</option>
                    <option value=1>Junior</option>
                    <option value=2>Senior</option>
                </select>
                <br>
                <label for="horas" class="form-label">Horas: </label>
                <input type="number" class="form-control mb-3" id="horas" placeholder="Ingresa las horas" name="horas">
                <button type="button" class="btn btn-warning mt-3" onclick="mostrarSueldo()">Calcular sueldo</button>
                <hr>
                <p class="alert alert-info mt-3 text-black" id="sueldoCalculado"></p>
            </div>
        </form>
    </section>
    <section class="container mt-5 bg-light p-4 rounded text-dark">
        <h2>Ejercicio Figura con Matriz</h2>
        <button class="btn btn-warning m-3" onclick="ejercicio3()">Mostrar Figura</button>
        <hr>
        <p class="font-monospace alert alert-info mt-3 text-black" id="impEjercicio3"></p>
    </section>

    <section class="container mt-5 bg-light p-4 rounded text-dark">
        <h2>Ejercicio Arreglo de Alumnos</h2>
        <button class="btn btn-warning m-3" onclick="capturarAlumnos()">Capturar 10 alumnos</button>
        <button class="btn btn-danger m-3" onclick="eliminarAlumnosRango()">Eliminar por rango (Splice)</button>
        <button class="btn btn-info m-3" onclick="vaciarPosicion()">Vaciar posición</button>
        <hr>
        <p class="alert alert-info mt-3 text-black"" id="impAlumnos"></p>
    </section>
    <footer class="mt-5 p-4 text-white text-center bg-success">
        <h5>Fernando Misael Hernández Salazar LDSM 405</h5>
    </footer>
    <script src="js/funcionesArreglos.js"></script>
</body>
</html>
