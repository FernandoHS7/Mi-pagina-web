    <title>Corredor</title>
</head>
<body>
    <div id="contenedor-pantalla">
        <main id="contenido-principal">
            <h2>Corredor</h2>
            <form name="form_corredor" method="post" action="#">
                <div class="linea-inputs">
                    <span>Nombre: <input type="text" id="nombre" /></span>
                    <span>App: <input type="text" id="app" /></span>
                    <span>Apm: <input type="text" id="apm" /></span>
                </div><br>

                <label>Edad:</label>
                <input type="number" id="edad" /><br><br>

                <label>Género:</label>
                <input type="radio" name="genero" value="F" /> F
                <input type="radio" name="genero" value="M" checked /> M
                <br><br>

                <label>Foto:</label>
                <input type="file" id="foto" /><br><br>

                <button type="submit" id="btn-guardar">Guardar</button>
            </form>
        </main>
